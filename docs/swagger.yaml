definitions:
  contract.DeleteItemResponse:
    properties:
      item:
        $ref: '#/definitions/contract.ItemDTO'
    type: object
  contract.GetAllItemsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/contract.ItemDTO'
        type: array
    type: object
  contract.GetItemResponse:
    properties:
      item:
        $ref: '#/definitions/contract.ItemDTO'
    type: object
  contract.ItemDTO:
    properties:
      aad:
        items:
          type: integer
        type: array
      ciphertext:
        items:
          type: integer
        type: array
      created_at:
        type: string
      deleted:
        type: boolean
      id:
        type: string
      nonce:
        items:
          type: integer
        type: array
      type:
        type: string
      updated_at:
        type: string
      updated_rev:
        type: integer
    type: object
  contract.LoginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  contract.LoginResponse:
    properties:
      expires_at:
        type: string
      jwt_token:
        type: string
      kdf_params:
        $ref: '#/definitions/contract.Params'
      kdf_salt:
        items:
          type: integer
        type: array
    type: object
  contract.Params:
    properties:
      algorithm:
        type: string
      key_len:
        type: integer
      memory:
        type: integer
      parallelism:
        type: integer
      salt_len:
        type: integer
      time:
        type: integer
    type: object
  contract.RegisterRequest:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  contract.RegisterResponse:
    properties:
      expires_at:
        type: string
      id:
        type: string
      jwt_token:
        type: string
      kdf_params:
        $ref: '#/definitions/contract.Params'
      kdf_salt:
        items:
          type: integer
        type: array
    type: object
  contract.SetItemRequest:
    properties:
      aad:
        items:
          type: integer
        type: array
      ciphertext:
        items:
          type: integer
        type: array
      nonce:
        items:
          type: integer
        type: array
      type:
        type: string
    type: object
  contract.SetItemResponse:
    properties:
      item:
        $ref: '#/definitions/contract.ItemDTO'
    type: object
  contract.SyncItemsResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/contract.ItemDTO'
        type: array
